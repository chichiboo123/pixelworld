<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4c8dff" />
  <title>PIXEL WORLD</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-gov.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 1단계: 비율 선택 -->
  <div id="screen-ratio" class="screen active">
    <div class="screen-inner">
      <h1 class="brand">PIXEL WORLD</h1>
      <p class="brand-sub">나만의 픽셀아트를 만들어 보아요!</p>

      <h2 class="screen-title">1단계 · 캔버스 모양을 골라요</h2>
      <div class="choice-grid">
        <button class="choice-card" data-ratio="landscape">
          <div class="choice-preview preview-landscape"></div>
          <div class="choice-label"><span class="material-icons">crop_landscape</span> 가로 모드</div>
        </button>
        <button class="choice-card" data-ratio="square">
          <div class="choice-preview preview-square"></div>
          <div class="choice-label"><span class="material-icons">crop_square</span> 정사각형 모드</div>
        </button>
        <button class="choice-card" data-ratio="portrait">
          <div class="choice-preview preview-portrait"></div>
          <div class="choice-label"><span class="material-icons">crop_portrait</span> 세로 모드</div>
        </button>
      </div>
    </div>
  </div>

  <!-- 2단계: 픽셀 수 선택 -->
  <div id="screen-size" class="screen">
    <div class="screen-inner">
      <h1 class="brand">PIXEL WORLD</h1>
      <p class="brand-sub">픽셀 칸 수를 정해요</p>

      <h2 class="screen-title">2단계 · 그림 크기를 골라요</h2>
      <div class="choice-grid">
        <button class="choice-card" data-size="small">
          <div class="choice-preview-size size-small"></div>
          <div class="choice-label"><span class="material-icons">grid_view</span> 소 (작게)</div>
          <div class="choice-desc" id="desc-small">16 × 16</div>
        </button>
        <button class="choice-card" data-size="medium">
          <div class="choice-preview-size size-medium"></div>
          <div class="choice-label"><span class="material-icons">grid_on</span> 중 (보통)</div>
          <div class="choice-desc" id="desc-medium">24 × 24</div>
        </button>
        <button class="choice-card" data-size="large">
          <div class="choice-preview-size size-large"></div>
          <div class="choice-label"><span class="material-icons">grid_4x4</span> 대 (크게)</div>
          <div class="choice-desc" id="desc-large">32 × 32</div>
        </button>
      </div>

      <button class="btn btn-ghost btn-back" id="btn-back-to-ratio">
        <span class="material-icons">arrow_back</span> 이전 단계
      </button>
    </div>
  </div>

  <!-- 3단계: 에디터 -->
  <div id="screen-editor" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="btn-home" title="홈으로">
          <span class="material-icons">home</span>
        </button>
        <button class="icon-btn icon-btn-secondary desktop-only" id="btn-back-step" title="이전 단계">
          <span class="material-icons">arrow_back</span>
        </button>
        <h1 class="brand-small">PIXEL WORLD</h1>
      </div>

      <!-- 모바일 전용: 도구 트리거 (붓·색상·사용자색) -->
      <div class="topbar-tools mobile-only">
        <div class="dropdown-wrap m-pop-wrap">
          <button type="button" class="m-trigger" id="m-trigger-brush" title="붓 크기">
            <span class="m-trigger-dot-slot">
              <span class="size-dot m-trigger-dot dot-1" id="m-brush-indicator"></span>
            </span>
          </button>
          <div class="dropdown m-popover" id="m-pop-brush">
            <div class="m-popover-title">붓 크기</div>
            <div class="size-toggle m-size-toggle">
              <button type="button" class="size-btn" data-brush="1">
                <span class="size-dot-slot"><span class="size-dot dot-1"></span></span>
                <span class="size-label">1칸</span>
              </button>
              <button type="button" class="size-btn" data-brush="2">
                <span class="size-dot-slot"><span class="size-dot dot-2"></span></span>
                <span class="size-label">4칸</span>
              </button>
              <button type="button" class="size-btn" data-brush="3">
                <span class="size-dot-slot"><span class="size-dot dot-3"></span></span>
                <span class="size-label">9칸</span>
              </button>
            </div>
            <p class="m-popover-hint">같은 칸을 다시 누르면 지워져요</p>
          </div>
        </div>

        <div class="dropdown-wrap m-pop-wrap">
          <button type="button" class="m-trigger m-trigger-color" id="m-trigger-color" title="색상">
            <span class="m-trigger-chip" id="m-color-indicator"></span>
          </button>
          <div class="dropdown m-popover m-popover-wide" id="m-pop-color">
            <div class="m-popover-title">색상</div>
            <div class="palette m-palette" id="m-palette"></div>
          </div>
        </div>

        <button type="button" class="m-trigger" id="m-trigger-custom" title="사용자 지정 색">
          <span class="material-icons">colorize</span>
        </button>
      </div>

      <div class="topbar-right">
        <button class="icon-btn icon-btn-secondary desktop-only" id="btn-guides" title="중앙 가이드라인">
          <span class="material-icons">grid_goldenratio</span>
        </button>
        <div class="history-group">
          <button class="icon-btn icon-btn-secondary" id="btn-undo" title="되돌리기" disabled>
            <span class="material-icons">undo</span>
          </button>
          <button class="icon-btn icon-btn-secondary" id="btn-redo" title="다시 실행" disabled>
            <span class="material-icons">redo</span>
          </button>
        </div>
        <button class="icon-btn icon-btn-danger desktop-only" id="btn-clear" title="전체 지우기">
          <span class="material-icons">delete_sweep</span>
        </button>
        <div class="dropdown-wrap desktop-only">
          <button class="icon-btn" id="btn-disk" title="저장 / 불러오기">
            <span class="material-icons">save</span>
          </button>
          <div class="dropdown" id="dropdown-disk">
            <button class="dropdown-item" id="btn-save-json">
              <span class="material-icons">file_download</span> 저장하기
            </button>
            <button class="dropdown-item" id="btn-load-json">
              <span class="material-icons">file_upload</span> 불러오기
            </button>
          </div>
        </div>
        <button class="icon-btn desktop-only" id="btn-reference" title="그림 참고하기">
          <span class="material-icons">image</span>
        </button>

        <!-- 모바일 전용: 더보기 메뉴 -->
        <div class="dropdown-wrap mobile-only">
          <button class="icon-btn icon-btn-secondary" id="btn-more" title="더보기">
            <span class="material-icons">more_vert</span>
          </button>
          <div class="dropdown dropdown-more" id="dropdown-more">
            <button class="dropdown-item" data-action="toggle-reference">
              <span class="material-icons">image</span> 그림 참고하기
            </button>
            <button class="dropdown-item" data-action="toggle-guides">
              <span class="material-icons">grid_goldenratio</span>
              <span id="more-guides-label">가이드라인 숨기기</span>
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" data-action="save-json">
              <span class="material-icons">file_download</span> 저장하기
            </button>
            <button class="dropdown-item" data-action="load-json">
              <span class="material-icons">file_upload</span> 불러오기
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" data-action="export-jpg">
              <span class="material-icons">download</span> JPG로 저장
            </button>
            <button class="dropdown-item" data-action="copy-jpg">
              <span class="material-icons">content_copy</span> 이미지 복사
            </button>
            <button class="dropdown-item" data-action="share-link">
              <span class="material-icons">link</span> 링크 공유
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item dropdown-item-danger" data-action="clear">
              <span class="material-icons">delete_sweep</span> 전체 지우기
            </button>
            <button class="dropdown-item" data-action="back-step">
              <span class="material-icons">arrow_back</span> 이전 단계
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="editor-main">
      <aside class="sidebar">
        <div class="tool-section tool-section-size">
          <div class="tool-title">붓 크기</div>
          <div class="size-toggle" id="size-toggle">
            <button class="size-btn active" data-brush="1">
              <span class="size-dot-slot"><span class="size-dot dot-1"></span></span>
              <span class="size-label">1칸</span>
            </button>
            <button class="size-btn" data-brush="2">
              <span class="size-dot-slot"><span class="size-dot dot-2"></span></span>
              <span class="size-label">4칸</span>
            </button>
            <button class="size-btn" data-brush="3">
              <span class="size-dot-slot"><span class="size-dot dot-3"></span></span>
              <span class="size-label">9칸</span>
            </button>
          </div>
          <p class="tool-hint">같은 칸을 다시 누르면 지워져요</p>
        </div>

        <div class="tool-section tool-section-color">
          <div class="tool-title">색상</div>
          <div class="palette" id="palette"></div>
          <button type="button" class="custom-color-btn" id="btn-custom-color">
            <span class="material-icons">colorize</span>
            <span>사용자 지정</span>
          </button>
          <input type="color" id="input-custom-color" value="#ff7eb6" class="hidden-color-input" aria-hidden="true" tabindex="-1" />
          <div class="current-color-row">
            <div class="current-color-label">현재 색</div>
            <div class="current-color-chip" id="current-color-chip"></div>
          </div>
        </div>

        <div class="tool-section tool-section-export">
          <div class="tool-title">내보내기</div>
          <div class="export-row">
            <button class="export-btn" id="btn-export-jpg" title="JPG 다운로드">
              <span class="material-icons">download</span>
              <span class="export-label">JPG</span>
            </button>
            <button class="export-btn" id="btn-copy-jpg" title="이미지 복사">
              <span class="material-icons">content_copy</span>
              <span class="export-label">복사</span>
            </button>
            <button class="export-btn" id="btn-share-link" title="링크 공유">
              <span class="material-icons">link</span>
              <span class="export-label">링크</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="canvas-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <div id="pixel-grid" class="pixel-grid"></div>
          <div class="guide-line guide-h" aria-hidden="true"></div>
          <div class="guide-line guide-v" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="reference-panel" id="reference-panel">
        <div class="reference-header">
          <h3><span class="material-icons">image</span> 그림 참고하기</h3>
          <button class="icon-btn icon-btn-sm" id="btn-close-reference" title="닫기">
            <span class="material-icons">close</span>
          </button>
        </div>
        <div class="reference-body">
          <label for="input-reference" class="reference-upload">
            <span class="material-icons">cloud_upload</span>
            <span>이미지를 선택하세요</span>
          </label>
          <input type="file" id="input-reference" accept="image/*" hidden />
          <div class="reference-preview" id="reference-preview">
            <p class="reference-hint">참고할 이미지를 올리면<br />여기에 보여요!</p>
          </div>
          <button class="btn btn-ghost btn-small" id="btn-remove-reference" style="display:none;">
            <span class="material-icons">delete</span> 이미지 지우기
          </button>
        </div>
      </aside>
    </main>
  </div>

  <!-- 모달 -->
  <div class="modal" id="modal-confirm">
    <div class="modal-card">
      <div class="modal-icon"><span class="material-icons">help_outline</span></div>
      <h3 class="modal-title" id="modal-title">확인</h3>
      <p class="modal-message" id="modal-message">정말 진행할까요?</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">취소</button>
        <button class="btn btn-primary" id="modal-ok">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <input type="file" id="input-load-json" accept="application/json" hidden />

  <footer class="app-footer">
    <a href="https://litt.ly/chichiboo" target="_blank" rel="noopener noreferrer">
      Created by. 교육뮤지컬 꿈꾸는 치수쌤
    </a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
